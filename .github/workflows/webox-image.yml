name: Build Webox image

on:
  workflow_dispatch:
    inputs:
      webox_ref:
        description: Webox git commit to build
        required: true
        default: 8ca042cd79221d05f6a74cb48064c7ba14220dc9
        type: string

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/repotea-workflow/devlife/webox
  WECHAT_DEB_URL: https://dldir1v6.qq.com/weixin/Universal/Linux/WeChatLinux_x86_64.deb
  WECHAT_DEB_SHA256: b7d0f8d53e9f648bc2c77a6096a04100d008f2d9f0d3988a2a4859b5992aca0a

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out Webox
        uses: actions/checkout@v6
        with:
          repository: netcat-ai/webox
          ref: ${{ inputs.webox_ref }}
          path: webox
          persist-credentials: false

      - name: Resolve source revision
        id: source
        working-directory: webox
        run: echo "short_sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: webox/go.mod
          cache-dependency-path: webox/go.sum

      - name: Test
        working-directory: webox
        run: |
          go test -race ./...
          go vet ./...

      - name: Download pinned WeChat package
        working-directory: webox
        run: |
          curl --fail --location --retry 5 --retry-all-errors \
            --output docker/wechat/WeChatLinux_x86_64.deb \
            "$WECHAT_DEB_URL"
          echo "$WECHAT_DEB_SHA256  docker/wechat/WeChatLinux_x86_64.deb" | sha256sum --check --strict
          dpkg-deb --info docker/wechat/WeChatLinux_x86_64.deb >/dev/null

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: webox
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ steps.source.outputs.short_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/repotea-workflow/devlife
            org.opencontainers.image.revision=${{ inputs.webox_ref }}
          cache-from: type=gha,scope=webox-amd64
          cache-to: type=gha,mode=max,scope=webox-amd64
          provenance: mode=max
          sbom: true

      - name: Summary
        run: |
          echo "### Webox image" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source: \`${{ inputs.webox_ref }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`${IMAGE}:sha-${{ steps.source.outputs.short_sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Digest: \`${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
