name: Build docker image

on:
#  push:
#    branches: [main]
  workflow_dispatch:
    inputs:
      package:
        description: Package to build. Leave empty to build every image.
        required: false
        type: string

env:
  DOCKER_REGISTRY: ghcr.io

jobs:
  build-docker-image:
    name: ${{ matrix.package.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    if: ${{ github.event.inputs.package == '' || github.event.inputs.package == matrix.package.name }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        package:
          - name: ansible-playbook
          - name: deployment-trigger
            build-args: |
              KUSTOMIZE_VERSION=v5.4.3
              YQ_VERSION=v4.44.3
          - name: dockcross-openwrt-armv32-sunxi
            dockerfile: Dockerfile.in
            build-args: |
              XCC_PREFIX=/usr/xcc
          - name: kubernetes-manifests
            build-args: |
              KUBECTL_VERSION=1.30.5
              KUSTOMIZE_VERSION=v5.4.3
              HELM_VERSION=v3.15.3
              HELMFILE_VERSION=0.166.0-3.15.3
              # K8S_VERSION=1.21.2
              # HELMFILE_VERSION=v0.140.0
          - name: terraform-records
            build-args: |
              TERRAFORM_VERSION=1.9.6
              TERRAFORM_BACKEND_GIT_VERSION=v0.1.6
          - name: webox
            build-args: |
              WEBOX_REF=8ca042cd79221d05f6a74cb48064c7ba14220dc9
              WECHAT_DEB_URL=https://dldir1v6.qq.com/weixin/Universal/Linux/WeChatLinux_x86_64.deb
              WECHAT_DEB_SHA256=b7d0f8d53e9f648bc2c77a6096a04100d008f2d9f0d3988a2a4859b5992aca0a
          - name: omniroute
            swap: true
            target: runner-base
            build-args: |
              OMNIROUTE_REF=a1baae7b0ab178d82114ef5bf60c503d8055ce63
              OMNIROUTE_USE_TURBOPACK=0
              OMNIROUTE_BUILD_MEMORY_MB=4096
    steps:
      - uses: actions/checkout@v4
      - uses: benjlevesque/short-sha@v3.0

      - name: Expand swap
        if: ${{ matrix.package.swap }}
        run: |
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile /swapfile
          sudo fallocate -l 10G /mnt/swapfile || sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=10240
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ${{ env.DOCKER_REGISTRY }}

      - name: ${{ matrix.package.name }}
        uses: docker/build-push-action@v6
        with:
          push: true
          context: docker-image/${{ matrix.package.name }}
          file: docker-image/${{ matrix.package.name }}/${{ matrix.package.dockerfile || 'Dockerfile' }}
          target: ${{ matrix.package.target }}
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/${{ matrix.package.name }}:sha-${{ env.SHA }}
            ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/${{ matrix.package.name }}:latest
          build-args: ${{ matrix.package.build-args }}

