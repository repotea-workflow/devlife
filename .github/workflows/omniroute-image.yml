name: Build OmniRoute image

on:
  workflow_dispatch:
    inputs:
      omniroute_ref:
        description: OmniRoute git commit to build
        required: true
        default: a1baae7b0ab178d82114ef5bf60c503d8055ce63
        type: string

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/repotea-workflow/devlife/omniroute

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Expand swap
        run: |
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile /swapfile
          sudo fallocate -l 10G /mnt/swapfile || sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=10240
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Check out OmniRoute
        uses: actions/checkout@v6
        with:
          repository: diegosouzapw/OmniRoute
          ref: ${{ inputs.omniroute_ref }}
          path: omniroute
          persist-credentials: false

      - name: Resolve source revision
        id: source
        working-directory: omniroute
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: omniroute
          file: omniroute/Dockerfile
          target: runner-base
          platforms: linux/amd64
          push: true
          build-args: |
            OMNIROUTE_USE_TURBOPACK=0
            OMNIROUTE_BUILD_MEMORY_MB=4096
          tags: |
            ${{ env.IMAGE }}:sha-${{ steps.source.outputs.short_sha }}
            ${{ env.IMAGE }}:next
          labels: |
            org.opencontainers.image.source=https://github.com/repotea-workflow/devlife
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
          cache-from: type=gha,scope=omniroute-amd64
          cache-to: type=gha,mode=max,scope=omniroute-amd64

      - name: Summary
        run: |
          echo "### OmniRoute image" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source: \`${{ steps.source.outputs.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`${IMAGE}:sha-${{ steps.source.outputs.short_sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Digest: \`${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
